image: eclipse-temurin:25-jdk-noble

options:
  max-time: 12

stepdefinitions:
  - build: &build
      name: Build
      size: 4x
      caches:
        - maven
        - maven-wrapper-dists
      script:
        - apt-get update && apt-get install -y --no-install-recommends unzip curl
        - java -version
        - ./mvnw --version
        - export TESTCONTAINERS_RYUK_DISABLED=true
        - ./mvnw -B -ntp clean install
        # Smoke-boot the packaged executable jar. The integration tests start the app from the test
        # classpath, so nothing else in this build ever exercises the repackaged artifact — a
        # packaging mistake (a dependency excluded or dropped from the fat jar) would otherwise first
        # be seen by whoever runs the release. Cf. ENTRYSTORE-1061.
        # application.yaml imports entrystore.properties non-optionally, so the file must exist.
        - printf 'entrystore.baseurl.folder=http://localhost:8299/store/\nentrystore.repository.store.type=memory\nentrystore.data.folder=%s/smoke-data/\nentrystore.solr=off\nentrystore.auth.temp.lockout.max.attempts=0\nentrystore.auth.temp.lockout.duration=0ms\n' "$BITBUCKET_CLONE_DIR" > entrystore.properties
        - mkdir -p smoke-data
        - export VERSION=`cat VERSION.txt`
        - java -jar modules/rest/spring-boot/target/entrystore-rest-spring-boot-${VERSION}-exec.jar --server.port=8299 > smoke.log 2>&1 & echo $! > smoke.pid
        - for i in $(seq 1 60); do curl -fsS http://localhost:8299/management/status && break || sleep 2; done
        - curl -fsS http://localhost:8299/management/status || (echo "--- exec jar failed to start ---"; tail -100 smoke.log; kill $(cat smoke.pid) 2>/dev/null; exit 1)
        # Cleanup only — never let a failed kill (process already gone) fail the step.
        - kill $(cat smoke.pid) 2>/dev/null || true
        - rm -f entrystore.properties smoke.pid
        - rm -rf ~/.m2/repository/org/entrystore/
      services:
        - docker-large
      artifacts:
        - modules/rest/*/target/**
        - modules/rest/integration-test/target/site/jacoco-aggregate/**
  - deploy: &deploy
      name: Deploy
      script:
        - apt update && apt install -y gnupg openssh-client
        - gpg --version
        - echo $GPG_SIGN_KEY | base64 -d | gpg --import
        - gpg --list-secret-keys
        - export VERSION=`cat VERSION.txt` && echo $VERSION
        # We allow semantic versioning plus x.y-z (e.g. 4.10-SNAPSHOT which does not exactly conform to semver)
        - echo $VERSION | grep -P -q '^(0|[1-9]\d*)\.(0|[1-9]\d*)(\.*)(0*|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'
        - export DOWNLOAD_NAME="entrystore-${VERSION}.jar"
        - cp modules/rest/spring-boot/target/entrystore-rest-spring-boot-${VERSION}-exec.jar ${DOWNLOAD_NAME}
        - sha256sum ${DOWNLOAD_NAME} > ${DOWNLOAD_NAME}.sha256
        - gpg --clearsign --default-key 4C12C06EE69EBA383C1A47C61010232068FF1D01 ${DOWNLOAD_NAME}.sha256
        - scp -v ${DOWNLOAD_NAME} ${DOWNLOAD_NAME}.sha256.asc deploy@meta1.metasolutions.se:/var/www/entrystore.org/download/
        - scp -rv modules/rest/integration-test/target/site/jacoco-aggregate/* deploy@meta1.metasolutions.se:/var/www/entrystore.org/test-coverage/
        - if [ $BITBUCKET_BRANCH == "develop" ]; then ssh deploy@meta1.metasolutions.se "echo $VERSION > /var/www/entrystore.org/download/develop.version" ; elif [ $BITBUCKET_BRANCH == "master" ]; then ssh deploy@meta1.metasolutions.se "echo $VERSION > /var/www/entrystore.org/download/latest.version" ; fi
  - dockerhub: &dockerhub
      name: Docker Hub
      script:
        - docker version
        - export VERSION=`cat VERSION.txt` && echo $VERSION
        # Drop any prerelease suffix before taking the first two segments, so both x.y.z and x.y-SNAPSHOT yield x.y.
        - export VERSION_MAJOR_MINOR=`echo ${VERSION%%-*} | cut -d. -f1,2` && echo $VERSION_MAJOR_MINOR
        - docker login -u $DOCKER_HUB_USER -p $DOCKER_HUB_PASSWORD
        - docker build -f docker/Dockerfile --build-arg ENTRYSTORE_VERSION=$VERSION --pull --no-cache --tag metasolutions/entrystore:$VERSION .
        # We export to TAR because on Bitbucket Grype cannot access the image directly through the Docker daemon's /var/run/docker.sock
        - docker save metasolutions/entrystore:$VERSION > "$BITBUCKET_CLONE_DIR/image.tar"
        # We scan for OS vulnerabilities with Grype before we push to the registry, code scanning is covered by Snyk
        - docker run --rm -v $BITBUCKET_CLONE_DIR/image.tar:/image.tar:ro anchore/grype --only-fixed --fail-on high --exclude "/srv/entrystore/**" docker-archive:/image.tar
        # Release branches publish candidates only; a snapshot tag from a release branch would be misleading.
        - if [[ $BITBUCKET_BRANCH != release/* ]]; then docker push metasolutions/entrystore:$VERSION ; fi
        - if [[ $BITBUCKET_BRANCH == release/* ]]; then docker tag metasolutions/entrystore:$VERSION metasolutions/entrystore:${VERSION_MAJOR_MINOR}-rc ; docker push metasolutions/entrystore:${VERSION_MAJOR_MINOR}-rc ; fi
        - if [ $BITBUCKET_BRANCH == "develop" ]; then docker tag metasolutions/entrystore:$VERSION metasolutions/entrystore:develop ; docker push metasolutions/entrystore:develop ; fi
        - if [ $BITBUCKET_BRANCH == "master" ]; then docker tag metasolutions/entrystore:$VERSION metasolutions/entrystore:$VERSION_MAJOR_MINOR ; docker push metasolutions/entrystore:$VERSION_MAJOR_MINOR ; fi
        # buildx is currently only supported with self-hosted runners, see https://confluence.atlassian.com/bbkb/building-multi-architecture-docker-images-with-bitbucket-pipelines-1252329371.html
        # - docker buildx create --use --platform=linux/arm64,linux/amd64 --name multi-platform-builder
        # - docker buildx build --build-arg ENTRYSTORE_VERSION=$VERSION --no-cache --pull --platform=linux/arm64,linux/amd64 --progress=plain --tag=$VERSION --push .
        # - if [ $BITBUCKET_BRANCH == "develop" ]; then docker buildx imagetools create -t metasolutions/entrystore:develop metasolutions/entrystore:$VERSION ; fi
        # - if [ $BITBUCKET_BRANCH == "master" ]; then docker buildx imagetools create -t metasolutions/entrystore:$VERSION_MAJOR_MINOR metasolutions/entrystore:$VERSION ; fi
      services:
        - docker
      caches:
        - docker
  # trivy was activated as a step before build, but it took a long time to run (~7 mins) and we also have Snyk
  # which is not as intrusive as a mandatory scanning step in the repo; deactivating it for now
  #- trivy: &trivy
  #    name: Trivy
  #    script:
  #      - export VERSION=`cat VERSION.txt` && echo $VERSION
  #      - docker run --rm -v "$BITBUCKET_CLONE_DIR":/repo:ro aquasec/trivy repo --exit-code 1 --format table --no-progress --severity HIGH,CRITICAL /repo
  #    services:
  #      - docker

pipelines:
  default:
    - step: *build
  branches:
    master:
      - step: *build
      - step: *deploy
      - step: *dockerhub
    develop:
      - step: *build
      - step: *deploy
      - step: *dockerhub
    'release/*':
      - step: *build
      - step: *dockerhub

definitions:
  caches:
    maven-wrapper-dists: ~/.m2/wrapper/dists
  services:
    docker-large:
      # this seems to not be multiplied with the "size" value above
      memory: 8192
      type: docker
