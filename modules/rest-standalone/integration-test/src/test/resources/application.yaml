
server:
  port: 8181
  servlet:
#    context-path: /store
    session.cookie:
      name: auth_token
      http-only: true
      secure: true
      same-site: strict
      max-age: 86400s


info.app.version: @project.version@


spring:
  mvc.problemdetails.enabled: false
  servlet.multipart:
    max-file-size: 12MB
    max-request-size: 12MB


entrystore:
  configuration.path: file:src/test/resources/entrystore-it.properties
  solr.url: value-will-be-overridden-by-tests


logging:
  level:
    org.entrystore: DEBUG
    org.springframework.security: DEBUG
