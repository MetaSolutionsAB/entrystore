
server:
  port: 8181
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    context-path: /store
    session.cookie:
      name: auth_token
      http-only: ${entrystore.auth.cookie.httponly:true}
      secure: ${entrystore.auth.cookie.secure:true}
      same-site: ${entrystore.auth.cookie.samesite:strict}
      max-age: ${entrystore.auth.cookie.max-age:86400s}


info.app.version: @project.version@


# Allow lifecycle-owned specs to replace the shared properties without importing both configurations.
spring:
  config.import:
    - "${entrystore-test.config-uri:classpath:entrystore-it.properties}"
  lifecycle:
    timeout-per-shutdown-phase: 5s
  mvc.problemdetails.enabled: false
  servlet.multipart:
    max-file-size: 100MB
    max-request-size: 100MB
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 7d
          cache-public: true


management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include: metrics,shutdown,loggers,env,httpexchanges,caches
      discovery:
        enabled: false
  endpoint:
    metrics:
      access: read_only
    shutdown:
      access: unrestricted
    env:
      show-values: when_authorized
  httpexchanges:
    recording:
      # Mirrors the production include list so the integration tests verify the same
      # Cookie/Authorization exclusions that protect real deployments.
      include: request-headers,response-headers,principal,remote-address,time-taken


logging:
  level:
    org.entrystore: DEBUG
    org.springframework.security: DEBUG
