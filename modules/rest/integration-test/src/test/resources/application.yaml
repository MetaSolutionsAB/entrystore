
server:
  port: 8181
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
#    context-path: /store
    session.cookie:
      name: auth_token
      http-only: ${entrystore.auth.cookie.httponly:true}
      secure: ${entrystore.auth.cookie.secure:true}
      same-site: ${entrystore.auth.cookie.samesite:strict}
      max-age: ${entrystore.auth.cookie.max-age:86400s}


info.app.version: @project.version@


# imported properties from "entrystore-it.properties" take precedence over properties here (when same key exists in both property sources)
spring:
  config.import:
    - classpath:entrystore-it.properties
  lifecycle:
    timeout-per-shutdown-phase: 5s
  mvc.problemdetails.enabled: false
  servlet.multipart:
    max-file-size: 12MB
    max-request-size: 12MB
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 7d
          cache-public: true


management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include: metrics
      discovery:
        enabled: false
  endpoint:
    metrics:
      access: read_only


logging:
  level:
    org.entrystore: DEBUG
    org.springframework.security: DEBUG
