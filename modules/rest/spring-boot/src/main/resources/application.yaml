server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  jetty:
    # Cap form-body parsing at 32 KB so an oversized POST is rejected during request parsing
    # before @RequestParam binding runs. SparqlController also asserts this cap in-method via
    # HttpUtil.checkRequestSize, which is the path that produces the 413 the IT exercises;
    # that path runs when the in-method cap is tighter or equal to this Jetty limit (the IT
    # configuration does not set this Jetty property, so the in-method cap is sole enforcer
    # there).
    max-http-form-post-size: 32KB
  servlet:
#    context-path: /store
    session.cookie:
      name: auth_token
      http-only: ${entrystore.auth.cookie.httponly:true}
      secure: ${entrystore.auth.cookie.secure:true}
      same-site: ${entrystore.auth.cookie.samesite:strict}
      max-age: ${entrystore.auth.cookie.max-age:86400s}


info.app.version: "@project.version@"


# imported properties from "entrystore.properties" take precedence over properties here (when the same key exists in both property sources)
spring:
  config.import:
    - file:entrystore.properties
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mvc.problemdetails.enabled: false
  servlet.multipart:
    max-file-size: 12MB
    max-request-size: 12MB
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 7d
          cache-public: true


springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: true


management:
  endpoints:
    web:
      base-path: /management
      exposure:
        # All exposed Actuator endpoints require ADMIN role — see EndpointRequest.toAnyEndpoint() in SecurityConfig
        include: metrics
      discovery:
        enabled: false
  endpoint:
    metrics:
      access: read_only


# Bounded executor for Spring MVC async dispatch (StreamingResponseBody, DeferredResult).
# Replaces Spring's default SimpleAsyncTaskExecutor so streaming endpoints can't spawn
# unbounded platform threads. Overflow beyond max-pool-size + queue-capacity is rejected
# via AbortPolicy and mapped to HTTP 503 by AppExceptionHandler. See MvcAsyncConfiguration.
#
# Sizing note: queue-capacity is intentionally small relative to default-timeout-ms. With
# core-pool-size=8 and SPARQL queries up to ~10 s, a request at queue position N waits
# ~N × 10 / 8 s before executing — past position ~12 the wait exceeds default-timeout-ms
# and the request is doomed to time out while still occupying a slot. Keeping the queue
# small lets overflow fail fast (503) so the client can back off, instead of accepting
# work it cannot complete.
mvc:
  async:
    core-pool-size: 8
    max-pool-size: 32
    queue-capacity: 16
    default-timeout-ms: 15000


logging:
  http:
    enabled: true   # Enabled is the default (i.e. when this property is not set), set it to "false" to disable request/response logging
