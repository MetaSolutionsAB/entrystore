server:
  port: 8080
  shutdown: graceful
  # forward-headers-strategy: framework honours X-Forwarded-Proto/Host/Port/Prefix via Spring's
  # ForwardedHeaderFilter. Spring does NOT validate which client sent the headers — the reverse
  # proxy in front of EntryStore MUST strip inbound X-Forwarded-* on untrusted requests before
  # forwarding, otherwise a client can spoof them and influence baseURL resolution (and
  # potentially poison shared caches via X-Forwarded-Prefix).
  forward-headers-strategy: framework
  jetty:
    # Cap form-body parsing at 32 KB so an oversized POST is rejected during request parsing
    # before @RequestParam binding runs. SparqlController also asserts this cap in-method via
    # HttpUtil.checkRequestSize, which is the path that produces the 413 the IT exercises;
    # that path runs when the in-method cap is tighter or equal to this Jetty limit (the IT
    # configuration does not set this Jetty property, so the in-method cap is sole enforcer
    # there).
    max-http-form-post-size: 32KB
  servlet:
#    context-path: /store
    session.cookie:
      name: auth_token
      http-only: ${entrystore.auth.cookie.httponly:true}
      secure: ${entrystore.auth.cookie.secure:true}
      same-site: ${entrystore.auth.cookie.samesite:strict}
      max-age: ${entrystore.auth.cookie.max-age:86400s}


info.app.version: "@project.version@"


# imported properties from "entrystore.properties" take precedence over properties here (when the same key exists in both property sources)
spring:
  config.import:
    - file:entrystore.properties
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mvc.problemdetails.enabled: false
  servlet.multipart:
    max-file-size: 100MB
    max-request-size: 100MB
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 7d
          cache-public: true


springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: true


management:
  endpoints:
    web:
      base-path: /management
      exposure:
        # All exposed Actuator endpoints require ADMIN role — see EndpointRequest.toAnyEndpoint() in SecurityConfig
        include: metrics,shutdown,loggers,env,httpexchanges,caches
      discovery:
        enabled: false
  endpoint:
    metrics:
      access: read_only
    shutdown:
      # Boot defaults endpoint access to 'none' even when exposed; 'unrestricted' here defers
      # access control to the global ADMIN filter in SecurityConfig (it does NOT mean public).
      access: unrestricted
    env:
      # show-values=WHEN_AUTHORIZED reveals property values only to authorized admins (the endpoint
      # is already ADMIN-gated in SecurityConfig). Credentials stay masked as ****** via the
      # SanitizingFunction bean in ActuatorConfiguration — which covers entrystore.auth.adminpw and
      # sun.java.command in addition to the conventional password/secret/key/token/credentials keys.
      show-values: when_authorized
  httpexchanges:
    recording:
      # The endpoint is admin-only, but recording the Cookie/Authorization headers or the session id
      # would let an admin read other users' live auth_token sessions. Capture only method/URI/status,
      # the requesting principal, remote address and latency — cookie-headers, authorization-header
      # and session-id are intentionally omitted.
      include: request-headers,response-headers,principal,remote-address,time-taken


# Bounded executor for Spring MVC async dispatch. See MvcAsyncConfiguration for the queue-capacity
# sizing rationale. Values here mirror the @DefaultValue defaults; this block is kept so an operator
# can override them with a single edit.
mvc:
  async:
    core-pool-size: 8
    max-pool-size: 32
    queue-capacity: 16
    default-timeout-ms: 15000


logging:
  http:
    enabled: true   # Enabled by default when unset; set to "false" to disable request/response logging
